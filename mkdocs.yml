site_name: DBGraph

theme:
  name: material

plugins:
  - search

  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_section_style: list
            show_root_full_path: false

nav:
  - Home: index.md
  - API Reference:
      - DatabaseGraph: refs/graph.md
      - Aspect: refs/aspect.md
