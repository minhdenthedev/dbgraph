[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbgraph"
version = "0.2.9"
description = "dbgraph is a database profiling tool which model the database as a graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s==0.3.11",
    "build==1.6.1",
    "grip>=4.6.2",
    "langchain==1.4.2",
    "langchain-openai==1.6.5",
    "matplotlib==3.11.2",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "openai==3.19.2",
    "psutil>=7.2.2",
    "pydantic==2.13.5",
    "pydot>=4.0.1",
    "pympler>=1.1",
    "pyrefly>=0.60.0",
    "pystemmer>=3.1.0",
    "python-dotenv==1.2.3",
    "rustworkx==0.18.1",
    "sqlalchemy==2.0.54",
    "tqdm==4.70.1",
    "trino==0.340.0",
]

[tool.setuptools.packages.find]
where = ["dbgraph"]
