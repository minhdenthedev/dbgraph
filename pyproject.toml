[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbgraph"
version = "0.2.0"
description = "dbgraph is a database profiling tool which model the database as a graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bm25s[all]>=0.3.9",
    "build>=1.6.0",
    "grip>=4.6.2",
    "langchain>=1.3.16",
    "langchain-openai>=1.6.0",
    "matplotlib>=3.11.0",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "openai>=2.45.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydot>=4.0.1",
    "pympler>=1.1",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.2",
    "rustworkx>=0.18.0",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.68.4",
    "trino>=0.339.0",
]

[tool.setuptools.packages.find]
where = ["dbgraph"]
