[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbgraph"
version = "0.2.13"
description = "dbgraph is a database profiling tool which model the database as a graph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "build==1.6.1",
    "grip>=4.6.2",
    "langchain==1.4.4",
    "langchain-openai==1.7.0",
    "matplotlib==3.11.2",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
    "openai==3.26.1",
    "psutil>=7.2.2",
    "pydantic==2.14.0",
    "pydot>=4.0.1",
    "pympler>=1.1",
    "pyrefly==1.3.2",
    "pystemmer>=3.1.0",
    "python-dotenv==1.2.4",
    "rustworkx==0.18.1",
    "sqlalchemy[asyncio]==2.1.4",
    "tqdm==4.70.1",
    "trino==0.340.0",
]

[tool.setuptools.packages.find]
where = ["dbgraph"]
